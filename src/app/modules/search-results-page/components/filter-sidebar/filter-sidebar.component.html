<!-- Sidebar toggle button for mobile/tablet -->
<button *ngIf="!hideToggleButton && !breakpointService.sidebarVisible() && !breakpointService.isVisible()"
  class="sidebar-toggle-btn" [class.left]="toggleButtonPosition === 'left'"
  (click)="breakpointService.toggleSidebar()" [attr.aria-label]="'open-filters' | translate">
  <i [class]="toggleButtonIcon"></i>
</button>

<!-- Capture projected content into a template -->
<ng-template #filterContent>
  <ng-content></ng-content>
</ng-template>

<!-- Mobile slide-up panel mode -->
@if (breakpointService.isMobile()) {
<app-slide-up-panel [title]="mobileTitleKey | translate" [hideTitle]="hideMobileTitle"
  [(isOpen)]="breakpointService.manualToggle"
  (closed)="breakpointService.manualToggle.set(false)">
  <ng-container *ngTemplateOutlet="filterContent"></ng-container>
</app-slide-up-panel>
}

<!-- Tablet/Desktop overlay and inline modes -->
@if (!breakpointService.isMobile()) {
<!-- Backdrop for tablet overlay -->
<div *ngIf="breakpointService.isVisible() && isOverlay()" class="sidebar-backdrop"
  (click)="onBackdropClick()"></div>

<div class="filter-sidebar" role="complementary" [attr.aria-label]="'search-filters' | translate"
  [class.overlay]="isOverlay()" [class.visible]="breakpointService.isVisible()"
  [class.overlay--paired-close]="hideMobileTitle"
  [class.disabled]="isDisabled" [class.dimmed]="dimmed">

  <!-- Close button for tablet overlay mode. Suppressed where the projected
       sidebar pairs its own X with its leading row (`hideMobileTitle` hosts, via
       app-sheet-close-button): this one floats absolutely at the top, which on a
       landscape phone left an empty row exactly where the caption used to be
       (GitHub issue #177). -->
  <button *ngIf="isOverlay() && breakpointService.isVisible() && !hideMobileTitle"
    class="sidebar-close-btn"
    (click)="breakpointService.toggleSidebar()" [attr.aria-label]="'close-filters' | translate">
    <i class="icon-close"></i>
  </button>

  <!-- Scrollable content area -->
  <div class="filter-content" [class.scrollable]="scrollable" [ngClass]="['padding-' + padding]">
    <ng-container *ngTemplateOutlet="filterContent"></ng-container>
  </div>

  @if (isDisabled) {
  <div class="sidebar-disabled--overlay"></div>
  }

  @if (dimmed) {
  <div class="sidebar-dimmed--overlay"></div>
  }
</div>
}
