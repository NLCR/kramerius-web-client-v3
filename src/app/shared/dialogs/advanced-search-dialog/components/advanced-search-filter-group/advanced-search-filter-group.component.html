<div class="filter-group">
  <div class="group-header">
    <div class="group-heading">
      <span class="group-index">{{ groupIndex + 1 }}</span>
      <span class="group-title">{{ 'group-label' | translate }} {{ groupIndex + 1 }}</span>
    </div>

    <div class="group-header-actions">
      <div class="operator-switch" *ngIf="filters.length > 1" role="group" [attr.aria-label]="'toggle-and-or-operator' | translate">
        <button
          type="button"
          class="operator-switch-option"
          [class.active]="operator === SolrOperators.and"
          [attr.aria-pressed]="operator === SolrOperators.and"
          (click)="setOperator(SolrOperators.and)">AND</button>
        <button
          type="button"
          class="operator-switch-option"
          [class.active]="operator === SolrOperators.or"
          [attr.aria-pressed]="operator === SolrOperators.or"
          (click)="setOperator(SolrOperators.or)">OR</button>
      </div>

      <button class="remove-group-icon" *ngIf="advancedSearchService.pendingGroups().length > 1"
              (click)="removeGroup.emit()" [attr.aria-label]="'remove-group-button-label' | translate">
        <i class="icon-trash" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="group-content">
    <div class="filter-items">
      <ng-container *ngFor="let filter of filters; let i = index; trackBy: trackByFn">

        @if (breakpointService.isMobile()) {
          <div class="mobile-condition-section">
            <div class="mobile-condition-header">
              <span class="mobile-condition-label">{{ 'condition-label' | translate }} {{ i + 1 }}</span>
              <button class="mobile-condition-remove button tertiary outlined" (click)="removeFilter(i)" [attr.aria-label]="'remove--button-label' | translate">
                <i class="icon-trash" aria-hidden="true"></i>
              </button>
            </div>

            <advanced-search-filter-row
              [filter]="filter"
              [isMobile]="true"
              (filterChange)="updateFilter(i, $event)"
              (remove)="removeFilter(i)"
              (addYearFilter)="addYearFilterRow()">
            </advanced-search-filter-row>
          </div>
        } @else {
          <div class="desktop-condition-row">
            <span class="condition-number" [attr.aria-hidden]="true">{{ i + 1 }}</span>
            <advanced-search-filter-row
              [filter]="filter"
              [isMobile]="false"
              (filterChange)="updateFilter(i, $event)"
              (remove)="removeFilter(i)"
              (addYearFilter)="addYearFilterRow()">
            </advanced-search-filter-row>
          </div>
        }

      </ng-container>
    </div>

    <div class="group-actions">
      <button class="button link primary with-icon p-left-0" (click)="addFilter()">
        <i class="icon-add-square" aria-hidden="true"></i>
        {{ 'next-condition-button-label' | translate }}
      </button>
    </div>
  </div>
</div>
