<header class="dialog-header">
  <div class="dialog-header__text">
    <h2 id="advanced-search-dialog-title">{{ 'advanced-search' | translate }}</h2>
    <p>{{ 'advanced-search-description' | translate }}</p>
  </div>
  <button class="button link tertiary icon-button close-button" (click)="close()" [attr.aria-label]="'close' | translate">
    <i class="icon-close" aria-hidden="true"></i>
  </button>
</header>

<div class="advanced-search-dialog" cdkScrollable>
  <div class="advanced-search-dialog--container">

    <section *ngIf="advancedSearchService.filters().length > 0"
             class="query-summary"
             [attr.aria-label]="'active-filters-region' | translate">
      <div class="query-summary__header">
        <span class="query-summary__label">{{ 'active-filters' | translate }}</span>
        <button class="button link tertiary clear-active" (click)="clearAllPending()">
          {{ 'delete-all' | translate }}
        </button>
      </div>
      <app-selected-tags
        [items]="advancedSearchService.filters()"
        [operators]="advancedSearchService.operators()"
        [showOperators]="false"
        [translateItems]="true"
        (remove)="removePendingTag($event)"
        (removeGroup)="clearPendingOperator($event)"
        [showClearAll]="false"
        (clearAll)="clearAllPending()"
        clearButtonPosition="left">
      </app-selected-tags>
    </section>

    <section class="builder" [attr.aria-label]="'filter-groups-region' | translate">
      <div class="builder-heading">
        <h3>{{ 'filter-groups-region' | translate }}</h3>
      </div>

      <div class="filters--content">
        <ng-container *ngFor="let group of advancedSearchService.pendingGroups(); let i = index; let last = last">
          <advanced-search-filter-group
            class="filter-group-box"
            [filters]="group.filters"
            [operator]="group.operator"
            [groupIndex]="i"
            (filtersChange)="advancedSearchService.updateGroupFilters(i, $event)"
            (operatorChange)="advancedSearchService.updateGroupOperator(i, $event)"
            (removeGroup)="advancedSearchService.removeGroup(i)">
          </advanced-search-filter-group>

          <div class="between-groups" *ngIf="!last">
            <span></span>
            <div class="main-operator" role="group" [attr.aria-label]="'toggle-and-or-operator' | translate">
              <button type="button"
                      [class.active]="advancedSearchService.mainOperator() === 'AND'"
                      [attr.aria-pressed]="advancedSearchService.mainOperator() === 'AND'"
                      (click)="advancedSearchService.mainOperator() !== 'AND' && advancedSearchService.toggleMainOperator()">AND</button>
              <button type="button"
                      [class.active]="advancedSearchService.mainOperator() === 'OR'"
                      [attr.aria-pressed]="advancedSearchService.mainOperator() === 'OR'"
                      (click)="advancedSearchService.mainOperator() !== 'OR' && advancedSearchService.toggleMainOperator()">OR</button>
            </div>
            <span></span>
          </div>
        </ng-container>

        <button class="add-group-card" (click)="advancedSearchService.addGroup()">
          <i class="icon-add-square" aria-hidden="true"></i>
          <span>{{ 'add-group-button-label' | translate }}</span>
        </button>
      </div>
    </section>

  </div>
</div>

<div class="footer">
  <button class="button link tertiary reset-search" (click)="deleteAll()"
          [disabled]="!advancedSearchService.hasPendingCriteria()">
    {{ 'delete-all' | translate }}
  </button>
  <button class="button primary submit-search" (click)="submit()">
    <i class="icon-search-normal-1" aria-hidden="true"></i>
    {{ 'search' | translate }}
  </button>
</div>
